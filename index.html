<div id="root"></div>
<script>
(function () {
  // Cache básico pra funcionar offline depois da primeira visita.
  // Falha silenciosa: se o navegador não suportar, o app funciona normal mesmo assim.
  try {
    if ("serviceWorker" in navigator) {
      var swCode = [
        "const CACHE = 'escalas-shell-v1';",
        "self.addEventListener('install', (e) => {",
        "  self.skipWaiting();",
        "  e.waitUntil(caches.open(CACHE).then((c) => c.add(self.registration.scope)).catch(()=>{}));",
        "});",
        "self.addEventListener('activate', (e) => { self.clients.claim(); });",
        "self.addEventListener('fetch', (e) => {",
        "  if (e.request.method !== 'GET') return;",
        "  e.respondWith(",
        "    fetch(e.request).then((res) => {",
        "      const copy = res.clone();",
        "      caches.open(CACHE).then((c) => c.put(e.request, copy)).catch(()=>{});",
        "      return res;",
        "    }).catch(() => caches.match(e.request).then((r) => r || caches.match(self.registration.scope)))",
        "  );",
        "});",
      ].join("\n");
      var blob = new Blob([swCode], { type: "application/javascript" });
      var swUrl = URL.createObjectURL(blob);
